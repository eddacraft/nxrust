[package]
name = "smoke"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

# Exercises GRAPH-001 tag lifting: these tags must appear on the inferred Nx
# project with no project.json. The e2e asserts `nx show project smoke --json`
# surfaces them.
[package.metadata.nxrust]
tags = ["cargo", "scope:smoke"]

# Exercises TARGETS-002 option overrides: this default must appear on the
# inferred test target's options end-to-end.
[package.metadata.nxrust.targets.test]
all-features = true
